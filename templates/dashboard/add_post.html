{%extends 'base.html'%}
{%block content%}
{%load crispy_forms_tags %}
<div class="row">
    <!-- Left Sidebar -->
    {% include 'dashboard/sidebar.html' %}
    
    
    <!-- Right Sidebar -->
    <div class="col-md-9">
        <h1>Add New Post</h1>
        <form action="{%url 'add_post'%}" method="POST" enctype="multipart/form-data">
            {%csrf_token%}
            {{form | crispy}}
            <button type="submit" class="btn btn-warning">
                Submit
            </button>
        </form>
        <br>
        
    </div>
</div>
{%endblock%}
